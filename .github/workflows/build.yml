name: build

# D-019: a build-only cross-platform matrix from early on, publishing UNSIGNED
# artifacts. Signing and notarization are deliberately deferred until the app is
# first handed to another person (see T-071). The point of running this from
# commit ~5 is that a transitive C dependency breaking the Windows build is
# cheap to learn now and exponentially expensive to learn later.

on:
  # Pushes to main, and pull requests (opened, plus each new push to an open
  # PR, so the PR's checks reflect its latest commit). Pushing a feature branch
  # without a PR runs nothing; open a PR, or use workflow_dispatch, to build it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # T-022 / R-017. The credential lint asserts that no struct on the connection
  # path carries a plain-`String` password field. It runs on one platform only
  # and without the Tauri system dependencies, because it is a source scan plus
  # the pure-logic unit tests — nothing here needs a webview to link.
  #
  # It is a separate job rather than a step in `build` so it reports as its own
  # red check and fails in ~30s instead of behind a full four-platform bundle.
  credential-lint:
    name: credential lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: credential-lint

      # R-017's guard: a plain-`String` credential field anywhere on the
      # connection path fails the build. This is what keeps T-028's and T-029's
      # parsers — which do not exist yet — from reintroducing the unprotected
      # window when they land.
      - name: No plaintext credential fields on the connection path
        run: cargo test -p sluice-core --test credential_lint -- --nocapture

      - name: Core contract and redaction tests
        run: cargo test -p sluice-core

      # T-067 / D-021: filter compilation, type-class mapping and the rest of
      # the driver's pure logic must run with NO database. This job has no
      # service container, so a unit test that quietly needed one fails here.
      - name: Driver unit tests without a database
        run: cargo test -p sluice-postgres --lib

  # T-028 / R-001 (critical). D-026 splits config discovery into an inert tier
  # (parsed, never executed — automatic and unprompted) and an executable tier
  # (consent-gated). The entire safety argument for making the first tier
  # automatic is that it cannot execute anything, so that property is asserted
  # mechanically here rather than trusted to review.
  #
  # Kept separate from `credential-lint` so a red check names the risk it broke:
  # this one going red means discovery can execute or prompt.
  config-safety-lint:
    name: config discovery is inert
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: config-safety-lint

      - name: Discovery path spawns no subprocess and shows no prompt
        run: cargo test -p sluice-config --test no_subprocess -- --nocapture

      - name: Config parsing tests
        run: cargo test -p sluice-config

      # T-029 / R-001. The unit tests prove the consent gate with a fake
      # interpreter; these spawn a real one and assert that a declined config
      # leaves its side-effect marker absent — with a consented control proving
      # the check is not vacuous. The runner has node, so they do not skip here.
      - name: Consent gate blocks real config execution
        run: cargo test -p sluice-config --test evaluate_live -- --nocapture

      # T-031 / R-032: a config branching on process.env must take the branch
      # the user's terminal would — shell env and project .env reach it, only
      # the app's own SLUICE_/TAURI_ variables are stripped.
      - name: Config subprocess sees the user's environment
        run: cargo test -p sluice-config --test evaluate_env_live -- --nocapture

      # T-032 / R-033: on Linux a consented config runs under bubblewrap with
      # the session bus and the app's credential files withheld. Installed
      # here so the test runs rather than skips; it fails if its own
      # no-sandbox control cannot see the fixture, so it cannot pass vacuously.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Sandboxed config cannot reach the keyring or credential files
        run: |
          set -o pipefail
          cargo test -p sluice-config --test evaluate_sandbox_live -- --nocapture 2>&1 | tee sandbox.log
          if grep -q "SKIP" sandbox.log; then echo "::error::sandbox test skipped on Linux CI"; exit 1; fi

  # T-019 / R-005: the exact-numeric edit path never turns a value into a JS
  # number. The guard also runs inside every matrix build (via `bun run build`),
  # but here it reports as its own check in seconds, alongside the validator's
  # unit tests — which assert int8 and numeric values an f64 cannot hold.
  exact-numeric-edit-path:
    name: exact numerics survive editing
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: No numeric conversion on the edit path
        run: bun run check:exact

      - name: Exact-numeric validator unit tests
        run: bun run test:unit

  # T-069 / R-018: the type-fidelity corpus (T-068) guards D-006, the one
  # decision that fails silently — so it must not be allowed to skip silently
  # either. A Postgres service container is started, TEST_PG_URL is set, and
  # the gate script fails on a skip, a missing summary, or zero checks. The
  # live driver suites (incl. T-039/T-040 pool reset) run against the same
  # server; they skip locally without one, but here a skip fails the job.
  # Locally the corpus still skips by default (D-021's no-ceremony property).
  type-fidelity-corpus:
    name: type fidelity corpus (postgres)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sluice_dev
          POSTGRES_DB: sluice_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_URL: postgres://postgres:sluice_dev@localhost:55432/sluice_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: type-fidelity-corpus

      - name: Corpus and live driver suites must run, not skip
        run: scripts/check-type-corpus.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x86_64
            # 22.04 carries libwebkit2gtk-4.1, which is the D-019 compatibility
            # floor. Building AppImage on the oldest supported base is what makes
            # the output portable across distros.
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The Cargo workspace root is the repo root (src-tauri is a member),
          # so the target dir is ./target — the same path artifacts are
          # collected from below. Pointing at src-tauri/target cached nothing.
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build
        # No signing credentials are provided anywhere in this workflow, so every
        # artifact is unsigned by construction rather than by omission.
        env:
          # Set explicitly rather than relying on the runner's default. macOS DMG
          # bundling drives Finder over AppleScript to lay the window out, which
          # fails with "Not authorized to send Apple events to Finder (-1743)" in
          # any session without Automation permission — verified locally. CI=true
          # makes tauri skip the cosmetic step and produce the DMG regardless.
          CI: true
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sluice-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
