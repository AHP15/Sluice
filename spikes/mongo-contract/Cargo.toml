[package]
name = "mongo-contract-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike for T-073 (R-029) and T-046 (R-039). Deliberately NOT a member
# of the app workspace: it must not contribute to the shipped lockfile.

[dependencies]
mongodb = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
